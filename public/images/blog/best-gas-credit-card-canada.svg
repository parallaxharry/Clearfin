yr</text><text x="735" y="380" font-size="22" fill="#5b6575">3% card</text><text x="975" y="380" font-size="28" font-weight="800" fill="#0877ff">$108/yr</text><text x="735" y="445" font-size="22" fill="#5b6575">Difference</text><text x="985" y="445" font-size="34" font-weight="800" fill="#0877ff">$36</text></g><line x1="735" y1="475" x2="1060" y2="475" stroke="#dce6f1"/><text x="735" y="515" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#071326">Then compare annual fees and other categories</text></svg>