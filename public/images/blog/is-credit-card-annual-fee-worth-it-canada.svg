<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Is a Credit Card Annual Fee Worth It in Canada?</title><desc id="desc">ClearFin editorial cover showing a break-even annual fee comparison.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient></defs><rect width="1200" height="675" rx="36" fill="url(#bg)"/><circle cx="1080" cy="95" r="175" fill="#e7f2ff"/><text x="64" y="88" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#071326">Clear<tspan fill="#0877ff">Fin</tspan></text><text x="64" y="210" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#071326">Is a Credit Card</text><rect x="60" y="232" width="435" height="82" rx="18" fill="#e3f1ff"/><text x="78" y="295" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" fill="#0877ff">Annual Fee</text><text x="64" y="374" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="800" fill="#071326">Worth It in Canada?</text><text x="64" y="440" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#5b6575">Use a break-even test instead of guessing.</text><rect x="700" y="130" width="390" height="400" rx="30" fill="#ffffff" stroke="#d9e5f3" stroke-width="2"/><text x="740" y="185" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#071326">Break-even test</text><g font-family="Arial,Helvetica,sans-serif"><text x="740" y="255" font-size="22" fill="#5b6575">Extra annual rewards</text><text x="970" y="255" font-size="28" font-weight="800" fill="#0877ff">$192</text><text x="740" y="325" font-size="22" fill="#5b6575">Annual fee</text><text x="970" y="325" font-size="28" font-weight="800" fill="#071326">−$120</text><line x1="735" y1="365" x2="1055" y2="365" stroke="#dce6f1"/><text x="740" y="425" font-size="22" font-weight="700" fill="#071326">Net advantage</text><text x="955" y="440" font-size="44" font-weight="800" fill="#0877ff">$72</text></g><rect x="64" y="510" width="260" height="8" rx="4" fill="#0877ff"/></svg>